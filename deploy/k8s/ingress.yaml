apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dotbintask
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - host: dotbintask.example.com
    http:
      paths:
      # API routes
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: dotbintask
            port:
              number: 8080
      # Health check
      - path: /health
        pathType: Exact
        backend:
          service:
            name: dotbintask
            port:
              number: 8080
      # Frontend routes
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dotbintask
            port:
              number: 80

