version: '3.8'

services:
  # Frontend - DotbinTask GUI
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      # Frontend is built with VITE_API_BASE_URL=/ 
      # API requests will be proxied through nginx
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - dotbintask

networks:
  dotbintask:
    name: dotbintask
    external: true

